<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Next Occasion</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            font-family: verdana, sans-serif;
        }

        .event-box {
            background-color: #ffffff;
            border: 2px solid rgb(51, 67, 80); 
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(51, 67, 80, 0.15); 
        }

        .event-box h1 {
            font-family: "Cormorant Garamond", serif;
            color: rgb(51, 67, 80);
            font-size: 42px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .event-box p {
            font-size: 18px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .event-label {
            font-weight: bold;
            color: rgb(51, 67, 80);
        }

        .back-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 28px;
            background-color: rgb(51, 67, 80);
            color: white;
            text-decoration: none;
            border-radius: 999px;
            font-weight: bold;
            transition: background-color 0.2s, transform 0.2s;
        }

        .back-btn:hover {
            background-color: rgb(71, 90, 105);
            transform: translateY(-2px);
        }
    </style>
</head>
