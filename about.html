<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - NextOccasion</title>
    <link rel="stylesheet" href="about.css">
</head>
<body>
    <main>
        <h1>Your Profile</h1>

        <label>
            Full Name
            <input type="text" id="fullName">
        </label>

        <label>
            Grade / Year
            <input type="text" id="gradeYear">
        </label>

        <label>
            Bio
            <textarea id="bio" rows="3"></textarea>
        </label>

        <label>
            Education
            <textarea id="education" rows="4"></textarea>
        </label>

        <label>
            Experience
            <textarea id="experience" rows="4"></textarea>
        </label>

        <label>
            Skills
            <textarea id="skills" rows="3"></textarea>
        </label>

        <label>
            Interests
            <textarea id="interests" rows="3"></textarea>
        </label>

        <div class="actions">
            <button id="saveBtn">Save</button>
            <button id="logoutBtn">Log Out</button>
        </div>

        <p id="status"></p>
    </main>

    <script type="module" src="about.js"></script>
</body>
</html>
